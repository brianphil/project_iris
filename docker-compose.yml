services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - iris_pg_data:/var/lib/postgresql/data

volumes:
  iris_pg_data:
